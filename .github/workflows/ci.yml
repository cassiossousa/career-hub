name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # The same dist/ that verify:all builds is reused as the Pages deploy
      # artifact, so main pushes install and build exactly once.
      - name: Run full verification
        run: npm run verify:all
        env:
          VITE_BASE_PATH: ${{ github.event_name == 'push' && '/professional-portfolio/' || '/' }}
      - name: Upload site artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/web/dist
          retention-days: 1
      - name: Run incremental mutation tests
        if: github.event_name == 'pull_request'
        run: npm run check:mutate:diff
      - name: Check visual baseline drift
        if: github.event_name == 'pull_request'
        run: npm run check:visual-baseline

  e2e:
    runs-on: ubuntu-latest
    # Visual-regression baselines are generated in this exact image, so CI and
    # baseline environments must stay in lockstep (see AGENTS.md §3).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:e2e
      - run: npm run check:lighthouse

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/configure-pages@v5
      # No checkout/npm ci/build here — reuses the dist/ artifact produced by
      # the test job's verify:all build.
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/web/dist
      - name: Add SPA route fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
