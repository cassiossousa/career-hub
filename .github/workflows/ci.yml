name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Run full verification
        run: npm run verify:all
      - name: Run incremental mutation tests
        if: github.event_name == 'pull_request'
        run: npm run check:mutate:diff
      - name: Check visual baseline drift
        if: github.event_name == 'pull_request'
        run: npm run check:visual-baseline

  e2e:
    runs-on: ubuntu-latest
    # Visual-regression baselines are generated in this exact image, so CI and
    # baseline environments must stay in lockstep (see AGENTS.md §3).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:e2e
      - run: npm run check:lighthouse
